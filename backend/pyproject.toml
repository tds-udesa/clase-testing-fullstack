[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.15.0",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["tests", "main.py"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes (flake8's core checks), I = isort
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["unit", "integration"]
testpaths = ["tests"]
python_files = ["test_*.py"]
